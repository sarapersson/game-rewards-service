version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The Docker Go builder version must stay aligned with go.mod's toolchain.
    # Minor/major updates are ignored; coordinate any allowed version bump with go.mod.
    ignore:
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
