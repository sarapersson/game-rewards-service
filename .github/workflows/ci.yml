name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DATABASE_URL: postgres://game_rewards:game_rewards_dev_password@localhost:5432/game_rewards?sslmode=disable

    services:
      postgres:
        image: postgres:18.6@sha256:ae6c78831cbc35fa3a4aaf4d763ddacf6183d6004774cc2dc28b3920410d1d1a
        env:
          POSTGRES_DB: game_rewards
          POSTGRES_USER: game_rewards
          POSTGRES_PASSWORD: game_rewards_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game_rewards -d game_rewards"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      - name: Run checks
        run: make check

      - name: Run race tests
        run: make test-race

      - name: Verify full database migration chain
        run: make db-check-full
        env:
          ALLOW_DESTRUCTIVE_DB_CHECK: "1"

      - name: Run integration tests
        run: make test-integration

      - name: Build Docker image
        run: make docker-build
