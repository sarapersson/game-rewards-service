name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DATABASE_URL: postgres://game_rewards:game_rewards_dev_password@localhost:5432/game_rewards?sslmode=disable
      DOCKER_IMAGE: game-rewards-service:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      - name: Run checks
        run: make check

      - name: Run race tests
        run: make test-race

      - name: Build runtime image
        run: make docker-build

      - name: Run runtime resilience smoke test
        run: make test-runtime-resilience

      - name: Start PostgreSQL
        run: make db-up

      - name: Verify database migration round trip
        run: make db-check
        env:
          ALLOW_DESTRUCTIVE_DB_CHECK: "1"

      - name: Run integration tests
        run: make test-integration
